<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>QED — animações corrigidas</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#111925;color:#e7d5b3}
body{max-width:1000px;margin:32px auto;padding:0 24px}h1{font-size:28px;margin:0 0 12px}
p{line-height:1.6;color:#aab9c7}main{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
figure{margin:0;background:#1b2738;border:1px solid #354459;border-radius:8px;padding:16px}
figcaption{margin-bottom:12px;font-size:15px}img{display:block;width:100%;max-width:256px;image-rendering:pixelated;margin:auto}
@media(max-width:760px){main{grid-template-columns:repeat(2,1fr)}}
</style>
<h1>QED / revisão das animações</h1>
<p>Caminhada do Mago gerada novamente. Recortes revisados para remover fragmentos de poses vizinhas.<br>Os GIFs repetem para inspeção; morte, dano e golpes encerram sua sequência no jogo.</p>
<main>
<figure><figcaption>Mago — caminhada</figcaption><img src="mago-walk-corrigido.gif" alt="Caminhada do Mago com alternância de pernas"></figure>
<figure><figcaption>Mago — conjuração</figcaption><img src="mago-cast-corrigido.gif" alt="Conjuração sem fragmentos atrás do Mago"></figure>
<figure><figcaption>Mago — morte</figcaption><img src="mago-death-corrigido.gif" alt="Morte do Mago com recorte revisado"></figure>
<figure><figcaption>Guerreiro — ataque</figcaption><img src="guerreiro-attack-completo.gif" alt="Ataque do Guerreiro com a lâmina e o arco azul completos"></figure>
<figure><figcaption>Guerreiro — coleta</figcaption><img src="guerreiro-gather-corrigido.gif" alt="Coleta do Guerreiro sem fragmentos de vizinhos"></figure>
<figure><figcaption>Guerreiro — dano</figcaption><img src="guerreiro-hurt-corrigido.gif" alt="Reação do Guerreiro a dano com recorte revisado"></figure>
</main>
</html>
